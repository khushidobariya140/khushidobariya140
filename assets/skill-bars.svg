<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animated skill progress bars</title>
<desc>Progress bars for Python, SQL, Data Analysis and BI tools, Supervised Machine Learning, Unsupervised Machine Learning, and Deep Learning / NLP</desc>

<defs>
  <linearGradient id="skillGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1E3A8A"/>
    <stop offset="100%" stop-color="#0EA5E9"/>
  </linearGradient>
</defs>

<!-- Python 90% -->
<text x="40" y="34" font-size="14" font-weight="600" fill="#94A3B8" font-family="Arial, sans-serif">Python</text>
<rect x="40" y="42" width="600" height="10" rx="5" fill="#334155" opacity="0.4"/>
<rect x="40" y="42" width="0" height="10" rx="5" fill="url(#skillGrad)">
  <animate attributeName="width" from="0" to="540" dur="1.6s" begin="0.1s" fill="freeze"/>
</rect>
<text x="646" y="52" font-size="12" fill="#0EA5E9" font-family="Arial, sans-serif" text-anchor="end" opacity="0">90%
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
</text>

<!-- SQL 85% -->
<text x="40" y="80" font-size="14" font-weight="600" fill="#94A3B8" font-family="Arial, sans-serif">SQL</text>
<rect x="40" y="88" width="600" height="10" rx="5" fill="#334155" opacity="0.4"/>
<rect x="40" y="88" width="0" height="10" rx="5" fill="url(#skillGrad)">
  <animate attributeName="width" from="0" to="510" dur="1.6s" begin="0.25s" fill="freeze"/>
</rect>
<text x="646" y="98" font-size="12" fill="#0EA5E9" font-family="Arial, sans-serif" text-anchor="end" opacity="0">85%
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.65s" fill="freeze"/>
</text>

<!-- Data Analysis & BI Tools 92% -->
<text x="40" y="126" font-size="14" font-weight="600" fill="#94A3B8" font-family="Arial, sans-serif">Data Analysis &amp; BI Tools (Power BI, Excel)</text>
<rect x="40" y="134" width="600" height="10" rx="5" fill="#334155" opacity="0.4"/>
<rect x="40" y="134" width="0" height="10" rx="5" fill="url(#skillGrad)">
  <animate attributeName="width" from="0" to="552" dur="1.6s" begin="0.4s" fill="freeze"/>
</rect>
<text x="646" y="144" font-size="12" fill="#0EA5E9" font-family="Arial, sans-serif" text-anchor="end" opacity="0">92%
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/>
</text>

<!-- Supervised ML 75% -->
<text x="40" y="172" font-size="14" font-weight="600" fill="#94A3B8" font-family="Arial, sans-serif">Supervised Machine Learning</text>
<rect x="40" y="180" width="600" height="10" rx="5" fill="#334155" opacity="0.4"/>
<rect x="40" y="180" width="0" height="10" rx="5" fill="url(#skillGrad)">
  <animate attributeName="width" from="0" to="450" dur="1.6s" begin="0.55s" fill="freeze"/>
</rect>
<text x="646" y="190" font-size="12" fill="#0EA5E9" font-family="Arial, sans-serif" text-anchor="end" opacity="0">75%
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.95s" fill="freeze"/>
</text>

<!-- Unsupervised ML (currently learning) 50% -->
<text x="40" y="218" font-size="14" font-weight="600" fill="#94A3B8" font-family="Arial, sans-serif">Unsupervised Machine Learning</text>
<rect x="40" y="226" width="600" height="10" rx="5" fill="#334155" opacity="0.4"/>
<rect x="40" y="226" width="0" height="10" rx="5" fill="url(#skillGrad)">
  <animate attributeName="width" from="0" to="300" dur="1.6s" begin="0.7s" fill="freeze"/>
</rect>
<text x="646" y="236" font-size="12" fill="#0EA5E9" font-family="Arial, sans-serif" text-anchor="end" opacity="0">50%
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
</text>

<!-- Deep Learning & NLP / Gen AI (early stage) 25% -->
<text x="40" y="264" font-size="14" font-weight="600" fill="#94A3B8" font-family="Arial, sans-serif">Deep Learning, NLP &amp; Gen AI</text>
<rect x="40" y="272" width="600" height="10" rx="5" fill="#334155" opacity="0.4"/>
<rect x="40" y="272" width="0" height="10" rx="5" fill="url(#skillGrad)">
  <animate attributeName="width" from="0" to="150" dur="1.6s" begin="0.85s" fill="freeze"/>
</rect>
<text x="646" y="282" font-size="12" fill="#0EA5E9" font-family="Arial, sans-serif" text-anchor="end" opacity="0">25%
  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.25s" fill="freeze"/>
</text>

</svg>
