<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, Consolas, monospace" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Terminal running a pandas snippet</title>
<desc>Animated terminal typing a pandas snippet that reads Khushi's own learning journey as a dataframe</desc>

<rect x="0" y="0" width="680" height="300" rx="10" fill="#1a1b27"/>
<rect x="0" y="0" width="680" height="34" rx="10" fill="#22233a"/>
<rect x="0" y="20" width="680" height="14" fill="#22233a"/>
<circle cx="24" cy="17" r="6" fill="#f7768e"/>
<circle cx="46" cy="17" r="6" fill="#e0af68"/>
<circle cx="68" cy="17" r="6" fill="#9ece6a"/>
<text x="340" y="22" text-anchor="middle" font-size="12" fill="#787c99">khushi@data-analyst: ~</text>

<g font-size="14" fill="#c0caf5">

<text x="24" y="65" opacity="0"><tspan fill="#9ece6a">&gt;&gt;&gt; </tspan>import pandas as pd
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.3s" fill="freeze"/>
</text>

<text x="24" y="92" opacity="0"><tspan fill="#9ece6a">&gt;&gt;&gt; </tspan>df = pd.read_csv("khushi_journey.csv")
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.2s" fill="freeze"/>
</text>

<text x="24" y="119" opacity="0"><tspan fill="#9ece6a">&gt;&gt;&gt; </tspan>df.head()
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.3s" fill="freeze"/>
</text>

<text x="24" y="150" opacity="0" fill="#787c99">
    Stage                    Status
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3s" fill="freeze"/>
</text>
<text x="24" y="174" opacity="0">0   Excel &amp; SQL Basics       <tspan fill="#9ece6a">Completed</tspan>
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.3s" fill="freeze"/>
</text>
<text x="24" y="198" opacity="0">1   Data Analysis (Power BI) <tspan fill="#9ece6a">Completed</tspan>
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.6s" fill="freeze"/>
</text>
<text x="24" y="222" opacity="0">2   Data Science              <tspan fill="#e0af68">In Progress</tspan>
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.9s" fill="freeze"/>
</text>

<text x="24" y="254" opacity="0"><tspan fill="#9ece6a">&gt;&gt;&gt; </tspan>
  <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.6s" fill="freeze"/>
</text>

<rect x="48" y="242" width="9" height="16" fill="#c0caf5" opacity="0">
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.5;0.52;1" dur="1s" begin="4.6s" repeatCount="indefinite"/>
</rect>

</g>
</svg>
