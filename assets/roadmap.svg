<svg width="100%" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data science roadmap</title>
<desc>Curved roadmap: Excel and SQL, Data Analysis with Power BI, Python for Data Science, and Supervised Machine Learning are completed; Unsupervised Machine Learning is in progress; Deep Learning and Model Deployment is upcoming</desc>

<rect x="0" y="0" width="760" height="260" fill="#0F172A" rx="12"/>

<!-- full dim base curve -->
<path d="M50,190 C70.67,184.17 132.67,166.67 174,155 C215.33,143.33 256.67,130.83 298,120 C339.33,109.17 381.67,99.17 422,90 C462.33,80.83 498.67,72.5 540,65 C581.33,57.5 648.33,48.33 670,45"
  fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

<!-- completed + in-progress curve, animated draw -->
<path d="M50,190 C70.67,184.17 132.67,166.67 174,155 C215.33,143.33 256.67,130.83 298,120 C339.33,109.17 381.67,99.17 422,90 C462.33,80.83 498.67,72.5 540,65"
  fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"
  pathLength="500" stroke-dasharray="500" stroke-dashoffset="500">
  <animate attributeName="stroke-dashoffset" from="500" to="0" dur="2.2s" begin="0.2s" fill="freeze"/>
</path>

<!-- moving marker riding the completed curve -->
<circle r="9" fill="#0EA5E9" stroke="#0F172A" stroke-width="2">
  <animateMotion dur="2.2s" begin="0.2s" fill="freeze"
    path="M50,190 C70.67,184.17 132.67,166.67 174,155 C215.33,143.33 256.67,130.83 298,120 C339.33,109.17 381.67,99.17 422,90 C462.33,80.83 498.67,72.5 540,65"/>
</circle>

<!-- station 1 : Excel & SQL -->
<circle cx="50" cy="190" r="9" fill="#2563EB"/>
<text x="50" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">Excel &amp; SQL</text>
<text x="50" y="234" text-anchor="middle" font-size="9" fill="#10B981">✓ completed</text>

<!-- station 2 : Data Analysis -->
<circle cx="174" cy="155" r="9" fill="#2563EB"/>
<text x="174" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">Data Analysis</text>
<text x="174" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">(Power BI &amp; Excel)</text>
<text x="174" y="213" text-anchor="middle" font-size="9" fill="#10B981">✓ completed</text>

<!-- station 3 : Python for Data Science -->
<circle cx="298" cy="120" r="9" fill="#2563EB"/>
<text x="298" y="35" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">Python for</text>
<text x="298" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">Data Science</text>
<text x="298" y="63" text-anchor="middle" font-size="9" fill="#10B981">✓ completed</text>

<!-- station 4 : Supervised ML -->
<circle cx="422" cy="90" r="9" fill="#2563EB"/>
<text x="422" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">Supervised</text>
<text x="422" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">Machine Learning</text>
<text x="422" y="148" text-anchor="middle" font-size="9" fill="#10B981">✓ completed</text>

<!-- station 5 : current -> Unsupervised ML -->
<circle cx="540" cy="65" r="11" fill="#F59E0B"/>
<circle cx="540" cy="65" r="11" fill="none" stroke="#F59E0B" stroke-width="2">
  <animate attributeName="r" values="11;19;11" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="540" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#F59E0B">Unsupervised</text>
<text x="540" y="21" text-anchor="middle" font-size="11" font-weight="700" fill="#F59E0B">Machine Learning</text>
<text x="540" y="106" text-anchor="middle" font-size="9" fill="#F59E0B">◉ currently here</text>

<!-- station 6 : Deep Learning & Deployment -->
<circle cx="670" cy="45" r="9" fill="#334155"/>
<text x="670" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#94A3B8">Deep Learning &amp;</text>
<text x="670" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#94A3B8">Model Deployment</text>
<text x="670" y="123" text-anchor="middle" font-size="9" fill="#64748B">upcoming</text>

</svg>
