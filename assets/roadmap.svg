<svg width="100%" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data science roadmap</title>
<desc>Metro-line style roadmap: Excel and SQL, Data Analysis with Power BI, and Python are completed; Statistics and Machine Learning is in progress; Deep Learning and Model Deployment is upcoming</desc>

<rect x="0" y="0" width="720" height="200" fill="#0f1019" rx="12"/>

<!-- base line (upcoming, dim) -->
<line x1="60" y1="100" x2="660" y2="100" stroke="#3b3d57" stroke-width="6" stroke-linecap="round"/>

<!-- completed + in-progress line, animated draw -->
<line x1="60" y1="100" x2="450" y2="100" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"
  stroke-dasharray="390" stroke-dashoffset="390">
  <animate attributeName="stroke-dashoffset" from="390" to="0" dur="2s" begin="0.2s" fill="freeze"/>
</line>

<!-- moving marker riding the line -->
<circle r="9" fill="#F59E0B" stroke="#1a1b27" stroke-width="2">
  <animateMotion dur="2s" begin="0.2s" fill="freeze" path="M60,100 L450,100"/>
</circle>
<circle r="14" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="2.2s" repeatCount="indefinite"/>
  <animate attributeName="r" values="10;22" dur="1.6s" begin="2.2s" repeatCount="indefinite"/>
  <animateMotion dur="0.01s" begin="2.2s" fill="freeze" path="M450,100 L450,100"/>
</circle>

<!-- station 1 -->
<circle cx="60" cy="100" r="10" fill="#06B6D4"/>
<text x="60" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#c0caf5">Excel &amp; SQL</text>
<text x="60" y="62" text-anchor="middle" font-size="10" fill="#9ece6a">✓ completed</text>

<!-- station 2 -->
<circle cx="255" cy="100" r="10" fill="#06B6D4"/>
<text x="255" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#c0caf5">Data Analysis</text>
<text x="255" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#c0caf5">(Power BI &amp; Excel)</text>
<text x="255" y="76" text-anchor="middle" font-size="10" fill="#9ece6a">✓ completed</text>

<!-- station 3 : current -->
<circle cx="450" cy="100" r="12" fill="#F59E0B"/>
<circle cx="450" cy="100" r="12" fill="none" stroke="#F59E0B" stroke-width="2">
  <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="450" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#F59E0B">Python for</text>
<text x="450" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#F59E0B">Data Science</text>
<text x="450" y="170" text-anchor="middle" font-size="10" fill="#F59E0B">◉ currently here</text>

<!-- station 4 -->
<circle cx="555" cy="100" r="10" fill="#3b3d57"/>
<text x="555" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#787c99">Statistics &amp;</text>
<text x="555" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#787c99">Machine Learning</text>
<text x="555" y="76" text-anchor="middle" font-size="10" fill="#565f89">upcoming</text>

<!-- station 5 -->
<circle cx="660" cy="100" r="10" fill="#3b3d57"/>
<text x="660" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#787c99">Deep Learning &amp;</text>
<text x="660" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#787c99">Model Deployment</text>
<text x="660" y="170" text-anchor="middle" font-size="10" fill="#565f89">upcoming</text>

</svg>
