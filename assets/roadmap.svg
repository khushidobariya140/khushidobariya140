<svg width="100%" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data science roadmap</title>
<desc>Metro-line style roadmap: Excel and SQL, Data Analysis with Power BI, Python for Data Science, and Supervised Machine Learning are completed; Unsupervised Machine Learning is in progress; Deep Learning and Model Deployment is upcoming</desc>

<rect x="0" y="0" width="760" height="200" fill="#0f1019" rx="12"/>

<!-- base line (upcoming, dim) -->
<line x1="50" y1="100" x2="670" y2="100" stroke="#3b3d57" stroke-width="6" stroke-linecap="round"/>

<!-- completed + in-progress line, animated draw -->
<line x1="50" y1="100" x2="540" y2="100" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"
  stroke-dasharray="490" stroke-dashoffset="490">
  <animate attributeName="stroke-dashoffset" from="490" to="0" dur="2.2s" begin="0.2s" fill="freeze"/>
</line>

<!-- moving marker riding the line -->
<circle r="9" fill="#F59E0B" stroke="#1a1b27" stroke-width="2">
  <animateMotion dur="2.2s" begin="0.2s" fill="freeze" path="M50,100 L540,100"/>
</circle>

<!-- station 1 : Excel & SQL -->
<circle cx="50" cy="100" r="9" fill="#06B6D4"/>
<text x="50" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">Excel &amp; SQL</text>
<text x="50" y="60" text-anchor="middle" font-size="9" fill="#9ece6a">✓ completed</text>

<!-- station 2 : Data Analysis -->
<circle cx="174" cy="100" r="9" fill="#06B6D4"/>
<text x="174" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">Data Analysis</text>
<text x="174" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">(Power BI &amp; Excel)</text>
<text x="174" y="76" text-anchor="middle" font-size="9" fill="#9ece6a">✓ completed</text>

<!-- station 3 : Python for Data Science -->
<circle cx="298" cy="100" r="9" fill="#06B6D4"/>
<text x="298" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">Python for</text>
<text x="298" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">Data Science</text>
<text x="298" y="170" text-anchor="middle" font-size="9" fill="#9ece6a">✓ completed</text>

<!-- station 4 : Supervised ML -->
<circle cx="422" cy="100" r="9" fill="#06B6D4"/>
<text x="422" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">Supervised</text>
<text x="422" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5">Machine Learning</text>
<text x="422" y="76" text-anchor="middle" font-size="9" fill="#9ece6a">✓ completed</text>

<!-- station 5 : current -> Unsupervised ML -->
<circle cx="540" cy="100" r="11" fill="#F59E0B"/>
<circle cx="540" cy="100" r="11" fill="none" stroke="#F59E0B" stroke-width="2">
  <animate attributeName="r" values="11;19;11" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="540" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#F59E0B">Unsupervised</text>
<text x="540" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#F59E0B">Machine Learning</text>
<text x="540" y="170" text-anchor="middle" font-size="9" fill="#F59E0B">◉ currently here</text>

<!-- station 6 : Deep Learning & Deployment -->
<circle cx="670" cy="100" r="9" fill="#3b3d57"/>
<text x="670" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#787c99">Deep Learning &amp;</text>
<text x="670" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#787c99">Model Deployment</text>
<text x="670" y="76" text-anchor="middle" font-size="9" fill="#565f89">upcoming</text>

</svg>
