<svg width="100%" viewBox="0 0 600 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Skill radar chart</title>
<desc>Hexagon radar chart showing proficiency in Python, SQL, Data Analysis and BI tools, Supervised Machine Learning, Unsupervised Machine Learning, and Deep Learning, NLP and Gen AI</desc>

<defs>
  <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2"/>
  </radialGradient>
</defs>

<!-- grid rings -->
<g stroke="#334155" stroke-width="1" fill="none" opacity="0.6">
<polygon points="300,175 330.3,192.5 330.3,227.5 300,245 269.7,227.5 269.7,192.5"/>
<polygon points="300,140 360.6,175 360.6,245 300,280 239.4,245 239.4,175"/>
<polygon points="300,105 390.9,157.5 390.9,262.5 300,315 209.1,262.5 209.1,157.5"/>
<polygon points="300,70 421.2,140 421.2,280 300,350 178.8,280 178.8,140"/>
</g>

<!-- axes -->
<g stroke="#334155" stroke-width="1" opacity="0.6">
<line x1="300" y1="210" x2="300" y2="70"/>
<line x1="300" y1="210" x2="421.2" y2="140"/>
<line x1="300" y1="210" x2="421.2" y2="280"/>
<line x1="300" y1="210" x2="300" y2="350"/>
<line x1="300" y1="210" x2="178.8" y2="280"/>
<line x1="300" y1="210" x2="178.8" y2="140"/>
</g>

<!-- data polygon -->
<polygon points="300,84 403.02,150.5 411.5,274.4 300,315 239.4,245 269.7,192.5"
  fill="url(#radarFill)" stroke="#0EA5E9" stroke-width="2.5" stroke-linejoin="round" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.2s" fill="freeze"/>
</polygon>

<!-- data points -->
<g fill="#0EA5E9">
<circle cx="300" cy="84" r="4"/>
<circle cx="403.02" cy="150.5" r="4"/>
<circle cx="411.5" cy="274.4" r="4"/>
<circle cx="300" cy="315" r="4"/>
<circle cx="239.4" cy="245" r="4"/>
<circle cx="269.7" cy="192.5" r="4"/>
</g>

<!-- axis labels -->
<text x="300" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Python</text>
<text x="300" y="64" text-anchor="middle" font-size="10" fill="#0EA5E9">90%</text>

<text x="450" y="132" text-anchor="start" font-size="12" font-weight="600" fill="#E2E8F0">SQL</text>
<text x="450" y="146" text-anchor="start" font-size="10" fill="#0EA5E9">85%</text>

<text x="450" y="282" text-anchor="start" font-size="12" font-weight="600" fill="#E2E8F0">Data Analysis</text>
<text x="450" y="296" text-anchor="start" font-size="12" font-weight="600" fill="#E2E8F0">&amp; BI Tools</text>
<text x="450" y="310" text-anchor="start" font-size="10" fill="#0EA5E9">92%</text>

<text x="300" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#E2E8F0">Supervised ML</text>
<text x="300" y="393" text-anchor="middle" font-size="10" fill="#0EA5E9">75%</text>

<text x="150" y="282" text-anchor="end" font-size="12" font-weight="600" fill="#E2E8F0">Unsupervised</text>
<text x="150" y="296" text-anchor="end" font-size="12" font-weight="600" fill="#E2E8F0">ML</text>
<text x="150" y="310" text-anchor="end" font-size="10" fill="#0EA5E9">50%</text>

<text x="150" y="132" text-anchor="end" font-size="12" font-weight="600" fill="#E2E8F0">Deep Learning,</text>
<text x="150" y="146" text-anchor="end" font-size="12" font-weight="600" fill="#E2E8F0">NLP &amp; Gen AI</text>
<text x="150" y="160" text-anchor="end" font-size="10" fill="#0EA5E9">25%</text>

</svg>
