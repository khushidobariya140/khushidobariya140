<svg width="100%" viewBox="0 0 680 14" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Section divider</title>
<desc>Minimal animated gradient line divider</desc>

<defs>
  <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a1b27" stop-opacity="0"/>
    <stop offset="15%" stop-color="#6D28D9"/>
    <stop offset="50%" stop-color="#06B6D4"/>
    <stop offset="85%" stop-color="#6D28D9"/>
    <stop offset="100%" stop-color="#1a1b27" stop-opacity="0"/>
  </linearGradient>
</defs>

<line x1="0" y1="7" x2="680" y2="7" stroke="url(#lineGrad)" stroke-width="2"/>

<circle r="4" fill="#06B6D4">
  <animateMotion dur="5s" repeatCount="indefinite" path="M0,7 L680,7"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
</circle>

</svg>
