<svg width="100%" viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data animation and orbiting skills</title>
<desc>Growing bar chart with trend line on the left, orbiting tech skill icons around a Data Analyst core on the right</desc>

<defs>
  <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#0EA5E9"/>
    <stop offset="100%" stop-color="#1E3A8A"/>
  </linearGradient>
  <linearGradient id="orbCore" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1E3A8A"/>
    <stop offset="100%" stop-color="#0EA5E9"/>
  </linearGradient>
</defs>

<!-- divider between the two halves -->
<line x1="345" y1="15" x2="345" y2="175" stroke="#4B5563" stroke-width="0.5" opacity="0.3"/>

<!-- ===== LEFT: bar chart ===== -->
<line x1="35" y1="150" x2="320" y2="150" stroke="#4B5563" stroke-width="1" opacity="0.4"/>

<g>
  <rect x="50"  y="150" width="24" height="0" rx="3" fill="url(#barGrad)">
    <animate attributeName="height" from="0" to="55" dur="1.1s" begin="0s" fill="freeze"/>
    <animate attributeName="y" from="150" to="95" dur="1.1s" begin="0s" fill="freeze"/>
    <animate attributeName="height" values="55;62;55" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="95;88;95" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="95" y="150" width="24" height="0" rx="3" fill="url(#barGrad)">
    <animate attributeName="height" from="0" to="85" dur="1.1s" begin="0.15s" fill="freeze"/>
    <animate attributeName="y" from="150" to="65" dur="1.1s" begin="0.15s" fill="freeze"/>
    <animate attributeName="height" values="85;78;85" dur="2.6s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="y" values="65;72;65" dur="2.6s" begin="1.25s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="150" width="24" height="0" rx="3" fill="url(#barGrad)">
    <animate attributeName="height" from="0" to="42" dur="1.1s" begin="0.3s" fill="freeze"/>
    <animate attributeName="y" from="150" to="108" dur="1.1s" begin="0.3s" fill="freeze"/>
    <animate attributeName="height" values="42;50;42" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="108;100;108" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="185" y="150" width="24" height="0" rx="3" fill="url(#barGrad)">
    <animate attributeName="height" from="0" to="70" dur="1.1s" begin="0.45s" fill="freeze"/>
    <animate attributeName="y" from="150" to="80" dur="1.1s" begin="0.45s" fill="freeze"/>
    <animate attributeName="height" values="70;63;70" dur="2.5s" begin="1.55s" repeatCount="indefinite"/>
    <animate attributeName="y" values="80;87;80" dur="2.5s" begin="1.55s" repeatCount="indefinite"/>
  </rect>
  <rect x="230" y="150" width="24" height="0" rx="3" fill="url(#barGrad)">
    <animate attributeName="height" from="0" to="100" dur="1.1s" begin="0.6s" fill="freeze"/>
    <animate attributeName="y" from="150" to="50" dur="1.1s" begin="0.6s" fill="freeze"/>
    <animate attributeName="height" values="100;92;100" dur="2.7s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="50;58;50" dur="2.7s" begin="1.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="275" y="150" width="24" height="0" rx="3" fill="url(#barGrad)">
    <animate attributeName="height" from="0" to="60" dur="1.1s" begin="0.75s" fill="freeze"/>
    <animate attributeName="y" from="150" to="90" dur="1.1s" begin="0.75s" fill="freeze"/>
    <animate attributeName="height" values="60;68;60" dur="2.3s" begin="1.85s" repeatCount="indefinite"/>
    <animate attributeName="y" values="90;82;90" dur="2.3s" begin="1.85s" repeatCount="indefinite"/>
  </rect>
</g>

<polyline points="62,105 107,75 152,118 197,90 242,60 287,100" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
  <animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="1.1s" fill="freeze"/>
</polyline>

<circle r="4" fill="#F59E0B">
  <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M62,105 L107,75 L152,118 L197,90 L242,60 L287,100"/>
</circle>

<!-- ===== RIGHT: orbiting skills ===== -->
<circle cx="500" cy="92" r="70" fill="none" stroke="#4B5563" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
<circle cx="500" cy="92" r="42" fill="none" stroke="#4B5563" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>

<circle cx="500" cy="92" r="32" fill="url(#orbCore)"/>
<text x="500" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">Data</text>
<text x="500" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">Analyst</text>

<g>
  <animateTransform attributeName="transform" type="rotate" from="0 500 92" to="360 500 92" dur="14s" repeatCount="indefinite"/>
  <circle cx="570" cy="92" r="19" fill="#F2C811"/>
  <text x="570" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1a1a1a" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="0 570 92" to="-360 570 92" dur="14s" repeatCount="indefinite"/>
    Power BI
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="90 500 92" to="450 500 92" dur="14s" repeatCount="indefinite"/>
  <circle cx="570" cy="92" r="19" fill="#217346"/>
  <text x="570" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-90 570 92" to="-450 570 92" dur="14s" repeatCount="indefinite"/>
    Excel
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="180 500 92" to="540 500 92" dur="14s" repeatCount="indefinite"/>
  <circle cx="570" cy="92" r="19" fill="#3776AB"/>
  <text x="570" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-180 570 92" to="-540 570 92" dur="14s" repeatCount="indefinite"/>
    Python
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="270 500 92" to="630 500 92" dur="14s" repeatCount="indefinite"/>
  <circle cx="570" cy="92" r="19" fill="#4479A1"/>
  <text x="570" y="95" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-270 570 92" to="-630 570 92" dur="14s" repeatCount="indefinite"/>
    SQL
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="45 500 92" to="405 500 92" dur="19s" repeatCount="indefinite"/>
  <circle cx="542" cy="92" r="13" fill="#150458"/>
  <text x="542" y="95" text-anchor="middle" font-size="6" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-45 542 92" to="-405 542 92" dur="19s" repeatCount="indefinite"/>
    Pandas
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="225 500 92" to="585 500 92" dur="19s" repeatCount="indefinite"/>
  <circle cx="542" cy="92" r="13" fill="#FF6E27"/>
  <text x="542" y="95" text-anchor="middle" font-size="6" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-225 542 92" to="-585 542 92" dur="19s" repeatCount="indefinite"/>
    DAX
  </text>
</g>

</svg>
