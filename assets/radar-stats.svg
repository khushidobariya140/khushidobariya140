<svg width="100%" viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GitHub stats radar chart</title>
<desc>Spider web chart showing commits, contributed repos, stars, pull requests, and issues</desc>

<defs>
  <radialGradient id="webFill" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#39d353" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#39d353" stop-opacity="0.15"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="500" height="420" fill="#1a1b27" rx="12"/>

<text x="250" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#c9cbff" font-family="Arial, sans-serif">GitHub Activity Web</text>

<!-- webbing rings (pentagon) -->
<g stroke="#3b3d57" stroke-width="1" fill="none" opacity="0.6">
<polygon points="250,90 372,168 326,308 174,308 128,168"/>
<polygon points="250,132 341,190 307,296 193,296 159,190"/>
<polygon points="250,174 310,212 288,284 212,284 190,212"/>
<polygon points="250,216 279,234 269,272 231,272 221,234"/>
</g>

<!-- axes -->
<g stroke="#3b3d57" stroke-width="1" opacity="0.6">
<line x1="250" y1="258" x2="250" y2="90"/>
<line x1="250" y1="258" x2="372" y2="168"/>
<line x1="250" y1="258" x2="326" y2="308"/>
<line x1="250" y1="258" x2="174" y2="308"/>
<line x1="250" y1="258" x2="128" y2="168"/>
</g>

<!-- data polygon: Commits 18/50, Contributed 6/20, Stars 0/20, PRs 0/20, Issues 0/20 -->
<!-- point positions computed along each axis proportionally to value/max, from center (250,258) to tip -->
<polygon points="250,197.5 286.6,231 250,258 250,258 250,258"
  fill="url(#webFill)" stroke="#39d353" stroke-width="2" stroke-linejoin="round">
  <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
</polygon>

<!-- data points -->
<circle cx="250" cy="197.5" r="4" fill="#39d353"/>
<circle cx="286.6" cy="231" r="4" fill="#39d353"/>
<circle cx="250" cy="258" r="4" fill="#39d353"/>
<circle cx="250" cy="258" r="4" fill="#39d353"/>
<circle cx="250" cy="258" r="4" fill="#39d353"/>

<!-- axis labels -->
<text x="250" y="76" text-anchor="middle" font-size="13" fill="#a9b1d6" font-family="Arial, sans-serif">Commits: 18</text>
<text x="392" y="164" text-anchor="start" font-size="13" fill="#a9b1d6" font-family="Arial, sans-serif">Contributed: 6</text>
<text x="340" y="330" text-anchor="middle" font-size="13" fill="#a9b1d6" font-family="Arial, sans-serif">Stars: 0</text>
<text x="160" y="330" text-anchor="middle" font-size="13" fill="#a9b1d6" font-family="Arial, sans-serif">PRs: 0</text>
<text x="108" y="164" text-anchor="end" font-size="13" fill="#a9b1d6" font-family="Arial, sans-serif">Issues: 0</text>

<text x="250" y="400" text-anchor="middle" font-size="11" fill="#565f89" font-family="Arial, sans-serif">Updated manually · edit assets/radar-stats.svg to refresh numbers</text>

</svg>
