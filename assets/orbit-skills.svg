<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Orbiting tech stack animation</title>
<desc>Tech skill labels orbiting around a central Data Analyst label</desc>

<defs>
  <linearGradient id="orbCore" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6D28D9"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
</defs>

<circle cx="340" cy="130" r="95" fill="none" stroke="#4B5563" stroke-width="0.5" opacity="0.35" stroke-dasharray="4 4"/>
<circle cx="340" cy="130" r="60" fill="none" stroke="#4B5563" stroke-width="0.5" opacity="0.35" stroke-dasharray="4 4"/>

<circle cx="340" cy="130" r="46" fill="url(#orbCore)"/>
<text x="340" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">Data</text>
<text x="340" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" font-family="Arial, sans-serif">Analyst</text>

<g>
  <animateTransform attributeName="transform" type="rotate" from="0 340 130" to="360 340 130" dur="16s" repeatCount="indefinite"/>
  <g>
    <circle cx="435" cy="130" r="26" fill="#F2C811"/>
    <text x="435" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" font-family="Arial, sans-serif">
      <animateTransform attributeName="transform" type="rotate" from="0 435 130" to="-360 435 130" dur="16s" repeatCount="indefinite"/>
      Power BI
    </text>
    <animateTransform attributeName="transform" type="rotate" from="0 435 130" to="-360 435 130" dur="16s" repeatCount="indefinite" additive="sum"/>
  </g>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="90 340 130" to="450 340 130" dur="16s" repeatCount="indefinite"/>
  <circle cx="435" cy="130" r="26" fill="#217346"/>
  <text x="435" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-90 435 130" to="-450 435 130" dur="16s" repeatCount="indefinite"/>
    Excel
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="180 340 130" to="540 340 130" dur="16s" repeatCount="indefinite"/>
  <circle cx="435" cy="130" r="26" fill="#3776AB"/>
  <text x="435" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-180 435 130" to="-540 435 130" dur="16s" repeatCount="indefinite"/>
    Python
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="270 340 130" to="630 340 130" dur="16s" repeatCount="indefinite"/>
  <circle cx="435" cy="130" r="26" fill="#4479A1"/>
  <text x="435" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-270 435 130" to="-630 435 130" dur="16s" repeatCount="indefinite"/>
    SQL
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="45 340 130" to="405 340 130" dur="22s" repeatCount="indefinite"/>
  <circle cx="400" cy="130" r="18" fill="#150458"/>
  <text x="400" y="133" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-45 400 130" to="-405 400 130" dur="22s" repeatCount="indefinite"/>
    Pandas
  </text>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="225 340 130" to="585 340 130" dur="22s" repeatCount="indefinite"/>
  <circle cx="400" cy="130" r="18" fill="#FF6E27"/>
  <text x="400" y="133" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif">
    <animateTransform attributeName="transform" type="rotate" from="-225 400 130" to="-585 400 130" dur="22s" repeatCount="indefinite"/>
    DAX
  </text>
</g>

</svg>
